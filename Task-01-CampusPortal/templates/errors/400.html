{% extends "base.html" %}

{% block title %}400 Bad Request - CampusPortal{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: 40px 30px; border-left: 6px solid var(--warning);">
    <div style="font-size: 3.5rem; margin-bottom: 12px;">⚠️ 400</div>
    <h1 style="font-size: 1.8rem; font-weight: 700; color: #111827; margin-bottom: 12px;">
      Bad Request
    </h1>
    <p style="color: #4b5563; font-size: 1rem; margin-bottom: 24px;">
      The request could not be processed due to invalid syntax, missing parameters, or an invalid CSRF token.
    </p>
    <div>
      <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
    </div>
  </div>
</div>
{% endblock %}
