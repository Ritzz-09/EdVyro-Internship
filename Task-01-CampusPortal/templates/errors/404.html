{% extends "base.html" %}

{% block title %}404 Not Found - CampusPortal{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: 40px 30px; border-left: 6px solid #6b7280;">
    <div style="font-size: 3.5rem; margin-bottom: 12px;">🔍 404</div>
    <h1 style="font-size: 1.8rem; font-weight: 700; color: #111827; margin-bottom: 12px;">
      Resource Not Found
    </h1>
    <p style="color: #4b5563; font-size: 1rem; margin-bottom: 24px;">
      The requested portal page or resource does not exist on this local defensive server.
    </p>
    <div>
      <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Portal Home</a>
    </div>
  </div>
</div>
{% endblock %}
